# ─────────────────────────────────────────────────────────────────────────────
# ci.yml
#
# Continuous Integration for the ai-pr-review CENTRAL repository.
#
# Runs the automated test suite on every push and PR to this repository.
# All tests are fully mocked — GROQ_API_KEY is NOT required.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout ai-pr-review
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run test suite
        run: npm test
